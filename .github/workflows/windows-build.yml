name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to attach files to a GitHub Release on tag builds

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Smoke test (from source)
        run: python desktop.py --smoke-test

      - name: Work out version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build executable
        run: python build.py

      - name: Smoke test (built .exe)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'smoke.log'
          $env:OLEEMA_SMOKE_LOG = $log
          $p = Start-Process -FilePath 'dist\Oleema\Oleema.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "Smoke test of built exe failed (exit code $($p.ExitCode))" }

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:Path += ';C:\Program Files (x86)\Inno Setup 6'
          }
          iscc /DAppVersion=${{ steps.version.outputs.version }} packaging\installer.iss

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\Oleema\* -DestinationPath dist\Oleema-Portable-${{ steps.version.outputs.version }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Oleema-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/Oleema-Setup-*.exe
            dist/Oleema-Portable-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Oleema-Setup-*.exe
            dist/Oleema-Portable-*.zip
